<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="pbi-bar1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAA300" />
      <stop offset="100%" stop-color="#C27A00" />
    </linearGradient>
    <linearGradient id="pbi-bar2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D648" />
      <stop offset="100%" stop-color="#EAA300" />
    </linearGradient>
    <linearGradient id="pbi-bar3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="100%" stop-color="#F9D648" />
    </linearGradient>
    <filter id="pbi-shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="-1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Tallest Bar (Right) -->
  <rect x="30" y="6" width="11" height="36" rx="4" fill="url(#pbi-bar1)" />
  <!-- Middle Bar (Center) -->
  <rect x="18" y="15" width="11" height="27" rx="4" fill="url(#pbi-bar2)" filter="url(#pbi-shadow)" />
  <!-- Smallest Bar (Left) -->
  <rect x="6" y="24" width="11" height="18" rx="4" fill="url(#pbi-bar3)" filter="url(#pbi-shadow)" />
</svg>