<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Hugging Face smolagents Official Brand Logo -->
  <circle cx="64" cy="64" r="54" fill="#FFD21E" />
  
  <!-- Blush on Cheeks -->
  <ellipse cx="28" cy="74" rx="9" ry="6" fill="#FF9E9E" opacity="0.6" />
  <ellipse cx="100" cy="74" rx="9" ry="6" fill="#FF9E9E" opacity="0.6" />

  <!-- Smiling Happy Eyes (Arches) -->
  <path d="M38 52 C38 43 50 43 50 52" stroke="#262626" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M78 52 C78 43 90 43 90 52" stroke="#262626" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Smiling Mouth -->
  <path d="M44 72 Q64 96 84 72" fill="#262626" />
  <path d="M52 79 Q64 96 76 79 Q64 88 52 79" fill="#FF6B6B" />

  <!-- Left Hugging Hand -->
  <g transform="translate(4, 76) rotate(-15)">
    <rect x="0" y="0" width="22" height="18" rx="8" fill="#FFD21E" stroke="#E6B800" stroke-width="2" />
    <path d="M14 0 C14 -6 6 -6 6 0" fill="#FFD21E" stroke="#E6B800" stroke-width="2" />
    <path d="M20 3 C20 -3 13 -3 13 3" fill="#FFD21E" stroke="#E6B800" stroke-width="2" />
  </g>

  <!-- Right Hugging Hand -->
  <g transform="translate(104, 70) rotate(15)">
    <rect x="0" y="0" width="22" height="18" rx="8" fill="#FFD21E" stroke="#E6B800" stroke-width="2" />
    <path d="M8 0 C8 -6 16 -6 16 0" fill="#FFD21E" stroke="#E6B800" stroke-width="2" />
    <path d="M2 3 C2 -3 9 -3 9 3" fill="#FFD21E" stroke="#E6B800" stroke-width="2" />
  </g>
