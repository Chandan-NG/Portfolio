<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- LangGraph Official Cyclic Agentic Graph Logo -->
  <defs>
    <linearGradient id="lg-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lg-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="lg-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Cyclic Directed Connecting Arcs -->
  <path d="M24 10 C34 10 38 18 36 28" stroke="#0284C7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M34 32 C28 40 18 40 14 32" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M12 28 C10 18 16 10 24 10" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Graph State Nodes -->
  <!-- Top State Node (Emerald) -->
  <circle cx="24" cy="10" r="6" fill="url(#lg-grad1)" />
  <circle cx="24" cy="10" r="2.5" fill="#FFFFFF" />

  <!-- Bottom-Right State Node (Sky Blue) -->
  <circle cx="36" cy="30" r="6" fill="url(#lg-grad2)" />
  <circle cx="36" cy="30" r="2.5" fill="#FFFFFF" />

  <!-- Bottom-Left State Node (Amber) -->
  <circle cx="12" cy="30" r="6" fill="url(#lg-grad3)" />
  <circle cx="12" cy="30" r="2.5" fill="#FFFFFF" />

  <!-- Directed Center Loop Node -->
  <circle cx="24" cy="24" r="3" fill="#6366F1" />
</svg>