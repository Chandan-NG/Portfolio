    <linearGradient id="vite-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#41D1FF" />
      <stop offset="50%" stop-color="#BD34FE" />
      <stop offset="100%" stop-color="#BD34FE" />
