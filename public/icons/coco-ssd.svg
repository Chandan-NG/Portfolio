<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- COCO-SSD Computer Vision Object Detection Neural Emblem -->
  <defs>
    <linearGradient id="coco-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0891B2" opacity="0.1" />

  <!-- Target Bounding Box Corners -->
  <path d="M24 44 V28 A4 4 0 0 1 28 24 H44" stroke="url(#coco-glow)" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M84 24 H100 A4 4 0 0 1 104 28 V44" stroke="url(#coco-glow)" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M104 84 V100 A4 4 0 0 1 100 104 H84" stroke="url(#coco-glow)" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M44 104 H28 A4 4 0 0 1 24 100 V84" stroke="url(#coco-glow)" stroke-width="7" stroke-linecap="round" fill="none" />

  <!-- Center Target Reticle / AI Focal Crosshair -->
  <circle cx="64" cy="64" r="18" stroke="#06B6D4" stroke-width="3.5" stroke-dasharray="4 4" fill="none" />
  <circle cx="64" cy="64" r="5" fill="#3B82F6" />
  <line x1="64" y1="36" x2="64" y2="44" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  <line x1="64" y1="84" x2="64" y2="92" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  <line x1="36" y1="64" x2="44" y2="64" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />
  <line x1="84" y1="64" x2="92" y2="64" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" />

  <!-- Model Detection Confidence Badge -->
  <rect x="22" y="14" width="34" height="13" rx="3" fill="#06B6D4" />
  <text x="39" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="8" fill="#FFFFFF">SSD</text>
</svg>
